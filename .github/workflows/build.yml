name: Build Phase Width 4 (macOS VST3)

on:
  workflow_dispatch:      # lets you start it with a button
  push:
    branches: [ main, master ]

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Run the DSP tests
        run: |
          cd tests
          clang++ -O2 -std=c++17 -I../Source test_dsp.cpp -o test_dsp
          ./test_dsp

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Ad-hoc sign (lets the plugin load on Apple Silicon)
        run: |
          VST=$(find build -name "*.vst3" -maxdepth 4 | head -1)
          echo "Built: $VST"
          codesign --force --deep --sign - "$VST"
          mkdir -p dist
          ditto -c -k --keepParent "$VST" dist/PhaseWidth4-vst3-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PhaseWidth4-VST3-mac
          path: dist/PhaseWidth4-vst3-mac.zip
